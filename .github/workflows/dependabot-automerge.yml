name: Dependabot · atualização segura

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  enable-auto-merge:
    name: Habilitar merge após verificações
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ler tipo da atualização
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Habilitar merge automático para patch ou minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PULL_REQUEST_URL"
